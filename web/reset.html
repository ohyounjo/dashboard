<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title></title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
<script type="module" src="auth.js"></script>
</head>
<body class="auth-page" data-page="reset">
<main class="auth" id="main">
  <div class="auth-banner" id="banner" hidden></div>
  <div class="auth-card">
    <div class="auth-mark" id="mark" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <p class="auth-intro" id="intro"></p>
    <div class="auth-msg" id="msg" hidden></div>
    <form id="form" novalidate></form>
    <nav class="auth-links" id="links"></nav>
  </div>
</main>
</body>
</html>
