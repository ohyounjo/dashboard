# PR의 화면을 변경 전(base)·변경 후(head)로 캡처해 PR 댓글로 비교한다.
#
# 0. meta: PR이 화면 파일(web/, projects/, superset/)을 바꿨는지 판단한다(ui_changed).
# 1. capture (base, head 동시에): 전체 서비스를 띄우고(make env → up → apply) e2e/capture.mjs로 캡처.
#    head 쪽은 캡처 뒤에 통합 테스트(make test)도 돌린다.
#    화면 파일이 바뀌지 않은 PR은 캡처를 건너뛰고 head 쪽 통합 테스트만 돌린다(base 작업은 만들지 않는다).
# 2. comment: 비교해서 달라진 화면만 ui-screenshots 브랜치에 올리고, PR에 비교 댓글을 달거나 고친다.
#    화면 파일이 바뀌지 않은 PR은 건너뛴다.
# 수동 실행(workflow_dispatch)은 화면 파일 변경과 상관없이 캡처한다.
#
# 캡처 스크립트(e2e/)는 항상 PR(head) 쪽 것을 쓴다. base에 e2e/가 없어도 동작한다.
name: UI 화면 캡처

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
      - "projects/**"
      - "superset/**"
      - "dashkit/**"
      - "contracts/**"
      - "tests/**"
      - "docker-compose.yml"
      - "Makefile"
      - "e2e/**"
      - ".github/workflows/ui-screenshots.yml"
  workflow_dispatch:
    inputs:
      pr:
        description: "다시 캡처할 PR 번호"
        required: true

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      ui_changed: ${{ steps.pr.outputs.ui_changed }}
      sides: ${{ steps.pr.outputs.sides }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          read -r base_ref head_sha < <(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" \
            --json baseRefName,headRefOid --jq '"\(.baseRefName) \(.headRefOid)"')
          # 변경 전 = PR이 갈라져 나온 지점이 아니라 지금의 base 브랜치 끝
          base_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$base_ref" --jq .sha)
          # 화면에 영향을 주는 파일이 바뀌었는지.
          # 파일 목록을 모든 페이지까지 먼저 다 받은 뒤 검색한다. gh를 grep -q에 바로 연결하면
          # grep이 먼저 끝나 gh가 broken pipe로 실패하고(pipefail), UI 변경이 있어도 false가 될 수 있다.
          # gh 자체가 실패하면 set -e로 이 작업이 실패한다(조용히 캡처를 건너뛰지 않는다).
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            ui_changed=true
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --jq '.[].filename')
            echo "바뀐 파일 $(printf '%s\n' "$files" | grep -c .)개"
            if printf '%s\n' "$files" | grep -E '^(web|projects|superset)/' > /dev/null; then
              ui_changed=true
            else
              ui_changed=false
            fi
          fi
          if [ "$ui_changed" = true ]; then sides='["base","head"]'; else sides='["head"]'; fi
          echo "화면 파일 변경: $ui_changed"
          {
            echo "number=$NUMBER"
            echo "base_ref=$base_ref"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "ui_changed=$ui_changed"
            echo "sides=$sides"
          } >> "$GITHUB_OUTPUT"

  capture:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.meta.outputs.sides) }}
    env:
      UI: ${{ needs.meta.outputs.ui_changed }}
    steps:
      - name: 앱 코드 받기 (${{ matrix.side }})
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.side == 'base' && needs.meta.outputs.base_sha || needs.meta.outputs.head_sha }}
          path: app

      - name: 캡처 스크립트 받기 (항상 head)
        if: env.UI == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.head_sha }}
          path: tools
          sparse-checkout: e2e

      - uses: actions/setup-node@v5
        if: env.UI == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json

      - name: Playwright·한글 폰트 설치
        if: env.UI == 'true'
        working-directory: tools/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 서비스 기동 (make env → up → apply)
        if: env.UI == 'true'
        working-directory: app
        run: |
          make env
          make up
          make apply

      # 웹앱이 로그인을 요구하는 버전(make admin이 있음)이면 캡처용 admin을 만든다. 비밀번호는 실행마다 새로 만든다
      - name: 캡처용 계정 만들기 (로그인 기능이 있는 버전만)
        if: env.UI == 'true'
        working-directory: app
        run: |
          if grep -q '^admin:' Makefile; then
            pw=$(openssl rand -hex 18)
            echo "::add-mask::$pw"
            domain=$(sed -n 's/^AUTH_EMAIL_DOMAINS=//p' .env | tail -1 | cut -d, -f1 | tr -d ' @')
            printf '%s\n' "$pw" | make admin EMAIL="e2e-admin@$domain" PASSWORD_STDIN=1
            { echo "E2E_EMAIL=e2e-admin@$domain"; echo "E2E_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          else
            echo "로그인 기능이 없는 버전: 계정 없이 캡처"
          fi

      - name: 화면 캡처
        if: env.UI == 'true'
        working-directory: tools/e2e
        run: node capture.mjs "$RUNNER_TEMP/shots/${{ matrix.side }}"

      # 통합 테스트(보강설계서 3-3). 이미 빌드된 이미지를 쓰도록 같은 작업에 붙인다.
      # 러너 메모리를 아끼려고 캡처가 끝난 개발 스택을 먼저 내린다(볼륨은 남는다). make test는 별도 스택을 띄웠다 내린다.
      - name: 통합 테스트 (make test)
        if: matrix.side == 'head'
        working-directory: app
        run: |
          if [ "$UI" = true ]; then make down; else make env; fi
          make test

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: app
        run: |
          docker compose logs --tail=200
          docker compose -p dashkit-test logs --tail=200 || true

      - uses: actions/upload-artifact@v7
        if: always() && env.UI == 'true'
        with:
          name: shots-${{ matrix.side }}
          path: ${{ runner.temp }}/shots/${{ matrix.side }}
          if-no-files-found: ignore
          retention-days: 14

  comment:
    needs: [meta, capture]
    if: always() && needs.meta.result == 'success' && needs.meta.outputs.ui_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # ui-screenshots 브랜치에 이미지 push
      pull-requests: write   # PR 댓글
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ needs.meta.outputs.number }}
      HEAD_SHA: ${{ needs.meta.outputs.head_sha }}
      BASE_REF: ${{ needs.meta.outputs.base_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHOTS_BRANCH: ui-screenshots
    steps:
      - name: 비교 스크립트 받기
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.head_sha }}
          path: tools
          sparse-checkout: e2e

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json

      - name: 비교 스크립트 의존성 설치 (pixelmatch, pngjs)
        working-directory: tools/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # 한쪽 캡처가 실패해 artifact가 없어도 계속 진행한다(댓글에 "캡처 실패"로 표시)
      - name: 변경 전 캡처 받기
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: shots-base
          path: cmp/base

      - name: 변경 후 캡처 받기
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: shots-head
          path: cmp/head

      - name: 비교 댓글 만들기 (달라진 화면만)
        id: report
        run: |
          dest="pr-$NUMBER/${HEAD_SHA:0:7}"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
          node tools/e2e/report.mjs cmp \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SHOTS_BRANCH}/${dest}" comment.md
          echo "count=$(wc -l < comment.md.upload)" >> "$GITHUB_OUTPUT"

      - name: 달라진 이미지만 ui-screenshots 브랜치에 올리기
        env:
          DEST: ${{ steps.report.outputs.dest }}
        run: |
          work="$RUNNER_TEMP/pub"
          git init -q "$work" && cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin "$SHOTS_BRANCH"; then
            git checkout -q -B "$SHOTS_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$SHOTS_BRANCH"
            printf '# ui-screenshots\n\nPR 화면 캡처 이미지 저장용 브랜치입니다. 워크플로가 자동으로 관리합니다.\n' > README.md
          fi
          rm -rf "pr-$NUMBER"   # 같은 PR의 예전 캡처는 지운다(최신 커밋 것만 유지)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$DEST/$(dirname "$f")"
            cp "$GITHUB_WORKSPACE/cmp/$f" "$DEST/$f"
          done < "$GITHUB_WORKSPACE/comment.md.upload"
          git add -A
          if git diff --cached --quiet; then echo "올릴 이미지 없음"; exit 0; fi
          git commit -q -m "PR #$NUMBER 화면 캡처 (${HEAD_SHA:0:7}, ${{ steps.report.outputs.count }}장)"
          for i in 1 2 3; do
            git push -q origin "$SHOTS_BRANCH" && break
            git fetch -q --depth=1 origin "$SHOTS_BRANCH" && git rebase -q FETCH_HEAD || true
            sleep 3
          done

      - name: PR에 댓글 달기 (있으면 고치기)
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ui-screenshots -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "댓글 수정: $id"
          else
            gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file comment.md
          fi
