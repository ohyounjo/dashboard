# 차트 갤러리(예시 3, 보강설계서 4-5). 축약 유형 전부와 카탈로그의 원본 유형을 하나씩 담는다.
# 쓰는 법: 화면에서 유형을 고르고, 여기서 같은 key의 차트 설정을 베껴 자기 데이터셋의 열·지표 이름으로 바꾼다.
# 유형별 필드의 기준은 contracts/chart-shorthand.md, 유형별 확인 기록은 contracts/superset-notes.md 10절.
app:
  title: 차트 갤러리
  logo_text: CG
  as_of: "2026-06-30"
  theme: { primary: { light: "#4D7C0F", dark: "#BEF264" } }

datasets:
  harvests:
    table: harvests
    labels: { harvest_no: "출하 번호", picked_on: "수확일", valley: "골짜기", orchard: "농원", fruit: "과일", grade: "등급", outlet: "판매 경로", buyer: "거래처", crates: "상자 수", weight_kg: "무게(kg)", crate_won: "상자당 단가(원)", crate_total: "상자 수", weight_total: "무게(kg)", avg_crate_won: "평균 단가(원)", harvest_count: "출하 건수", top_grade_pct: "특등급 비율(%)" }
    metrics:
      crate_total: "SUM(crates)"
      weight_total: "ROUND(SUM(weight_kg))"
      avg_crate_won: "ROUND(AVG(crate_won))"
      harvest_count: "COUNT(*)"
      top_grade_pct: "ROUND(100.0 * COUNT(*) FILTER (WHERE grade = '특') / NULLIF(COUNT(*), 0), 1)"
  sorting_steps:
    table: sorting_steps
    labels: { step_title: "단계", crates_remaining: "남은 상자" }
    metrics: { crates_remaining: "SUM(crates_left)" }
  crate_ledger:
    table: crate_ledger
    labels: { booked_on: "기록일", net_crates: "상자 증감" }
    metrics: { net_crates: "SUM(delta_crates)" }
  depot_hauls:
    table: depot_hauls
    labels: { from_depot: "출발 창고", to_depot: "도착 창고", pallet_total: "팰릿 수" }
    metrics: { pallet_total: "SUM(pallets)" }
  farm_units:
    table: farm_units
    metrics: { staff_total: "SUM(staff)" }
  field_jobs:
    table: field_jobs
    labels: { job_title: "작업", crew: "작업조", begins_at: "시작", finishes_at: "끝" }

dashboards:
  # ------------------------------------------------------------ 기존 6종
  shelf_basic:
    title: 기존 6종
    charts:
      - { key: g_big_number_total, title: "숫자(big_number_total)", viz: big_number_total, dataset: harvests, metric: crate_total, subtitle: 상자, format: ",d" }
      - key: g_big_number
        title: "숫자와 추이(big_number)"
        viz: big_number
        dataset: harvests
        metric: crate_total
        time_column: picked_on
        time_grain: P1W
        compare_suffix: 전주 대비
      - { key: g_line, title: "선(line)", viz: line, dataset: harvests, x: picked_on, time_grain: P1W, metrics: [crate_total], groupby: [valley] }
      - { key: g_bar, title: "막대(bar)", viz: bar, dataset: harvests, x: orchard, metrics: [weight_total], horizontal: true, format: ",d" }
      - { key: g_pie, title: "원(pie)", viz: pie, dataset: harvests, groupby: [fruit], metric: crate_total, donut: true }
      - key: g_table
        title: "표(table)"
        viz: table
        dataset: harvests
        columns: [harvest_no, picked_on, orchard, fruit, grade, crates, weight_kg]
        order_by: [[weight_kg, desc]]
        row_limit: 10
    layout:
      - [{ chart: g_big_number_total, width: 4 }, { chart: g_big_number, width: 8 }]
      - [g_line, g_bar]
      - [{ chart: g_pie, width: 4 }, { chart: g_table, width: 8 }]

  # ------------------------------------------------------------ 추이 4종
  shelf_trend:
    title: 추이 4종
    charts:
      - key: g_area
        title: "영역(area)"
        viz: area
        dataset: harvests
        x: picked_on
        time_grain: P1M
        metrics: [weight_total]
        groupby: [fruit]
        stacked: true
        format: ",d"
      - { key: g_scatter, title: "시계열 산점(scatter)", viz: scatter, dataset: harvests, x: picked_on, time_grain: P1D, metrics: [avg_crate_won], format: ",d" }
      - key: g_mixed
        title: "혼합(mixed): 막대 + 선"
        viz: mixed
        dataset: harvests
        x: picked_on
        time_grain: P1M
        metrics: [crate_total]          # 첫째 묶음
        series_type: bar
        metrics_b: [avg_crate_won]      # 둘째 묶음
        series_type_b: line
        secondary_axis: true            # 둘째 묶음을 오른쪽 축에
        format: ",d"
        format_b: ",d"
      - key: g_waterfall
        title: "폭포(waterfall)"
        viz: waterfall
        dataset: crate_ledger
        x: booked_on
        time_grain: P1M
        metric: net_crates
        show_value: true
        params: { x_axis_time_format: "%Y-%m" }   # 축약에 없는 옵션은 params로 더한다
    layout:
      - [g_area, g_scatter]
      - [g_mixed, g_waterfall]

  # ------------------------------------------------------------ 비율·단계 4종
  shelf_share:
    title: 비율·단계 4종
    charts:
      - { key: g_funnel, title: "퍼널(funnel)", viz: funnel, dataset: sorting_steps, groupby: [step_title], metric: crates_remaining }
      - { key: g_gauge, title: "게이지(gauge)", viz: gauge, dataset: harvests, metric: top_grade_pct, min_value: 0, max_value: 100 }
      - { key: g_treemap, title: "트리맵(treemap)", viz: treemap, dataset: harvests, groupby: [valley, orchard], metric: weight_total }
      - key: g_sunburst
        title: "선버스트(sunburst)"
        viz: sunburst
        dataset: harvests
        columns: [valley, orchard, fruit]   # 안쪽 → 바깥쪽
        metric: crate_total
    layout:
      - [g_funnel, g_gauge]
      - [g_treemap, g_sunburst]

  # ------------------------------------------------------------ 교차·분포 5종
  shelf_cross:
    title: 교차·분포 5종
    charts:
      - { key: g_heatmap, title: "히트맵(heatmap)", viz: heatmap, dataset: harvests, x: orchard, y: fruit, metric: crate_total }
      - key: g_pivot_table
        title: "피벗 테이블(pivot_table)"
        viz: pivot_table
        dataset: harvests
        rows: [valley, orchard]
        columns: [grade]
        metrics: [crate_total]
        format: ",d"
      - { key: g_histogram, title: "히스토그램(histogram)", viz: histogram, dataset: harvests, column: weight_kg, bins: 12 }
      - key: g_box_plot
        title: "상자 수염(box_plot)"
        viz: box_plot
        dataset: harvests
        groupby: [fruit]              # 상자 하나가 되는 묶음
        columns: [harvest_no]         # 분포를 이루는 단위(이 열마다 지표 값 하나)
        metrics: [weight_total]
      - key: g_bubble
        title: "버블(bubble)"
        viz: bubble
        dataset: harvests
        entity: orchard               # 버블 하나
        series: valley                # 색
        x: avg_crate_won
        y: weight_total
        size: crate_total
    layout:
      - [g_heatmap, g_pivot_table]
      - [g_histogram, g_box_plot, g_bubble]

  # ------------------------------------------------------------ 관계·기타 3종
  shelf_links:
    title: 관계·기타 3종
    charts:
      - key: g_radar
        title: "레이더(radar)"
        viz: radar
        dataset: harvests
        groupby: [valley]               # 도형 하나
        metrics:                        # 꼭짓점 하나씩. 크기가 비슷한 지표끼리 쓴다
          - { sql: "SUM(crates) FILTER (WHERE grade = '특')", label: 특 }
          - { sql: "SUM(crates) FILTER (WHERE grade = '상')", label: 상 }
          - { sql: "SUM(crates) FILTER (WHERE grade = '보통')", label: 보통 }
          - { sql: "SUM(crates) FILTER (WHERE outlet = '온라인')", label: 온라인 }
          - { sql: "SUM(crates) FILTER (WHERE outlet = '대형마트')", label: 대형마트 }
      - { key: g_sankey, title: "생키(sankey)", viz: sankey, dataset: harvests, source: valley, target: outlet, metric: crate_total }
      - { key: g_word_cloud, title: "워드 클라우드(word_cloud)", viz: word_cloud, dataset: harvests, series: buyer, metric: harvest_count }
    layout:
      - [g_radar, g_sankey]
      - [g_word_cloud]

  # ------------------------------------------------------------ 원본 유형(viz_type + params)
  # 축약에 없는 유형은 Superset 이름과 파라미터를 그대로 쓴다. params 안의 열 이름은 make check가 검사하지 않는다.
  # chord, world_map, country_map은 여기 넣지 않았다. 임베드(guest) 화면에서 그려지지 않는다(reference/chart-catalog.md 4-3절).
  shelf_native:
    title: 원본 유형
    charts:
      - key: g_graph_chart                   # 관계망
        title: "관계망(graph_chart)"
        viz_type: graph_chart
        dataset: depot_hauls
        params: { source: from_depot, target: to_depot, metric: pallet_total, layout: circular }
      - key: g_tree_chart                    # 트리. 행마다 id와 부모 id가 있어야 한다
        title: "트리(tree_chart)"
        viz_type: tree_chart
        dataset: farm_units
        params: { id: unit_no, parent: parent_no, name: unit_title, root_node_id: "1", metric: staff_total }
      - key: g_gantt_chart                   # Superset 간트
        title: "간트(gantt_chart)"
        viz_type: gantt_chart
        dataset: field_jobs
        params: { start_time: begins_at, end_time: finishes_at, y_axis: job_title, series: crew, y_axis_title_margin: 80 }
    layout:
      - [g_graph_chart, g_tree_chart]
      - [g_gantt_chart]

tabs:
  - { key: basic_six, label: 기존 6종, icon: grid, sections: [{ type: superset, dashboard: shelf_basic }] }
  - { key: trend_set, label: 추이 묶음, icon: chart, sections: [{ type: superset, dashboard: shelf_trend }] }
  - { key: share_set, label: 비율·단계 묶음, icon: target, sections: [{ type: superset, dashboard: shelf_share }] }
  - { key: cross_set, label: 교차·분포 묶음, icon: table, sections: [{ type: superset, dashboard: shelf_cross }] }
  - { key: links_set, label: 관계·기타 묶음, icon: flag, sections: [{ type: superset, dashboard: shelf_links }] }
  - { key: native_set, label: 원본 유형 묶음, icon: box, sections: [{ type: superset, dashboard: shelf_native }] }
