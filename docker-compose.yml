# dashkit: Superset 임베드형 범용 대시보드 템플릿
# 값은 .env에서 읽는다(`make env`로 생성). 포트는 127.0.0.1에만 연다.

x-superset-env: &superset-env
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?make env 필요}
  SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?make env 필요}
  GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:?make env 필요}
  GUEST_TOKEN_JWT_AUDIENCE: ${GUEST_TOKEN_JWT_AUDIENCE}
  WEB_ORIGINS: ${WEB_ORIGINS}
  # Studio(make studio)를 띄울 때만 값이 있다. 있으면 frame-ancestors에 더한다(미리보기의 중첩 iframe)
  STUDIO_ORIGIN: ${STUDIO_ORIGIN:-}
  SUPERSET_LOAD_EXAMPLES: "no"

# Superset 버전은 .env.example의 SUPERSET_VERSION 한 곳에서 온다(Makefile이 .env.example → .env 순으로 읽는다)
x-superset-build: &superset-build
  context: ./superset
  args:
    SUPERSET_VERSION: ${SUPERSET_VERSION:?SUPERSET_VERSION이 없음. make로 실행하거나 .env.example의 값을 .env에 추가}

x-data-db-env: &data-db-env
  DATA_DB_HOST: ${DATA_DB_HOST}
  DATA_DB_PORT: ${DATA_DB_PORT}
  DATA_DB_NAME: ${DATA_DB_NAME}
  DATA_DB_READER_USER: ${DATA_DB_READER_USER}
  DATA_DB_READER_PASSWORD: ${DATA_DB_READER_PASSWORD:?make env 필요}

# 인증 DB 계정과 로그인 설정(contracts/auth.md). backend와 tools(make admin)가 쓴다
x-auth-env: &auth-env
  DATA_DB_AUTH_USER: ${DATA_DB_AUTH_USER:-dash_auth}
  DATA_DB_AUTH_PASSWORD: ${DATA_DB_AUTH_PASSWORD:?make env 필요}
  AUTH_EMAIL_DOMAINS: ${AUTH_EMAIL_DOMAINS:?AUTH_EMAIL_DOMAINS가 필요(가입을 허용할 메일 도메인)}
  AUTH_MAIL_MODE: ${AUTH_MAIL_MODE:-test}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
  WEB_ORIGINS: ${WEB_ORIGINS}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
  AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-480}
  AUTH_SESSION_MAX_DAYS: ${AUTH_SESSION_MAX_DAYS:-7}

services:
  data-db:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      # superuser는 postgres로 따로 두고, 로더 계정(dash_owner)은 01-reader.sh가 일반 역할로 만든다.
      # 인증 계정(dash_auth)과 dashkit_auth 스키마는 02-auth.sh가 만든다(이미 있는 볼륨에는 make auth-init)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATA_DB_ADMIN_PASSWORD:?make env 필요}
      POSTGRES_DB: ${DATA_DB_NAME}
      DATA_DB_OWNER_USER: ${DATA_DB_OWNER_USER}
      DATA_DB_OWNER_PASSWORD: ${DATA_DB_OWNER_PASSWORD:?make env 필요}
      DATA_DB_READER_USER: ${DATA_DB_READER_USER}
      DATA_DB_READER_PASSWORD: ${DATA_DB_READER_PASSWORD:?make env 필요}
      DATA_DB_AUTH_USER: ${DATA_DB_AUTH_USER:-dash_auth}
      DATA_DB_AUTH_PASSWORD: ${DATA_DB_AUTH_PASSWORD:?make env 필요}
      TZ: ${TZ}
    volumes:
      - data-db:/var/lib/postgresql/data
      - ./data-db/init:/docker-entrypoint-initdb.d:ro
      # 인증 스키마의 번호 붙은 SQL(02-auth.sh가 순서대로 적용한다)
      - ./dashkit/auth/sql:/dashkit-auth-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  superset-db:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?make env 필요}
      POSTGRES_DB: superset
    volumes:
      - superset-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 일회성: db upgrade → 관리자 → superset init → EmbedGuest 역할. 재실행해도 성공한다.
  superset-init:
    build: *superset-build
    image: dashkit-superset:${SUPERSET_VERSION:?SUPERSET_VERSION이 없음. make로 실행하거나 .env.example의 값을 .env에 추가}
    command: ["/app/superset_init/init.sh"]
    restart: "no"
    environment:
      <<: *superset-env
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?make env 필요}
    depends_on:
      superset-db:
        condition: service_healthy

  superset:
    build: *superset-build
    image: dashkit-superset:${SUPERSET_VERSION:?SUPERSET_VERSION이 없음. make로 실행하거나 .env.example의 값을 .env에 추가}
    restart: unless-stopped
    environment:
      <<: *superset-env
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: dashkit/Dockerfile
      target: app
    image: dashkit-app:local
    restart: unless-stopped
    # SUPERSET_ADMIN_PASSWORD, DATA_DB_OWNER_PASSWORD는 주지 않는다. 인증 DB는 dash_auth 계정만
    environment:
      <<: [*data-db-env, *auth-env]
      PROJECT: ${PROJECT}
      TZ: ${TZ}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:?make env 필요}
      GUEST_TOKEN_JWT_AUDIENCE: ${GUEST_TOKEN_JWT_AUDIENCE}
      STATE_DIR: ${STATE_DIR}
      DATA_MAX_ROWS: ${DATA_MAX_ROWS}
    volumes:
      - ./projects:/app/projects:ro
      # 테스트 스택(make test)은 HOST_STATE_DIR, STATE_DIR을 .test/state로 바꿔 개발 상태와 분리한다
      - ${HOST_STATE_DIR:-./.state}:${STATE_DIR:-/app/.state}:ro
    depends_on:
      data-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  web:
    image: nginx:1.29.3-alpine
    restart: unless-stopped
    environment:
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL}
      # 웹앱을 iframe에 넣을 수 있는 출처. 평소에는 'none'이고 Studio(make studio)를 띄울 때만 그 출처가 된다
      WEB_FRAME_ANCESTORS: ${STUDIO_ORIGIN:-'none'}
      # envsubst 대상을 이 두 변수로 제한한다($uri 등 nginx 변수 보호)
      NGINX_ENVSUBST_FILTER: "^(SUPERSET_PUBLIC_URL|WEB_FRAME_ANCESTORS)$$"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 일회성: make check/load/sync/test. 저장소 전체를 마운트해 소스를 그대로 쓴다.
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: dashkit/Dockerfile
      target: app
    image: dashkit-app:local
    restart: "no"
    environment:
      # 인증 DB 계정은 make admin, make test(로그인 도우미·DB 계정 경계 테스트)가 쓴다
      <<: [*data-db-env, *auth-env]
      PROJECT: ${PROJECT}
      TZ: ${TZ}
      SUPERSET_URL: ${SUPERSET_URL}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?make env 필요}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:?make env 필요}
      GUEST_TOKEN_JWT_AUDIENCE: ${GUEST_TOKEN_JWT_AUDIENCE}
      DATA_DB_OWNER_USER: ${DATA_DB_OWNER_USER}
      DATA_DB_OWNER_PASSWORD: ${DATA_DB_OWNER_PASSWORD:?make env 필요}
      STATE_DIR: ${STATE_DIR}
      BUILD_DIR: ${BUILD_DIR}
      # sync가 만든 Superset 객체의 화면 편집 차단(기본 1). contracts/state-and-uuid.md "표식"
      SYNC_LOCK_UI: ${SYNC_LOCK_UI:-1}
      DATA_MAX_ROWS: ${DATA_MAX_ROWS}
    volumes:
      - .:/app

  # 구성 화면(보강설계서 6절). `make studio`로만 띄운다. projects/를 고치고 check·load·sync를 실행하므로
  # tools와 같은 권한(owner DB 계정, Superset 관리자 계정)을 가진다. 인증이 없으니 127.0.0.1에만 연다. 운영 배포에 넣지 않는다.
  studio:
    profiles: ["studio"]
    build:
      context: .
      dockerfile: dashkit/Dockerfile
      target: studio
    image: dashkit-studio:local
    restart: "no"
    # projects/에 쓰는 파일이 호스트 사용자 소유가 되도록 같은 uid:gid로 실행한다(Makefile이 넘긴다)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *data-db-env
      PROJECT: ${PROJECT}
      TZ: ${TZ}
      WEB_ORIGINS: ${WEB_ORIGINS}
      SUPERSET_URL: ${SUPERSET_URL}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?make env 필요}
      DATA_DB_OWNER_USER: ${DATA_DB_OWNER_USER}
      DATA_DB_OWNER_PASSWORD: ${DATA_DB_OWNER_PASSWORD:?make env 필요}
      STATE_DIR: ${STATE_DIR}
      BUILD_DIR: ${BUILD_DIR}
      SYNC_LOCK_UI: ${SYNC_LOCK_UI:-1}
      # 브라우저가 Studio와 웹앱(미리보기 iframe)에 접속하는 주소. Studio는 Host·Origin이 STUDIO_ORIGIN일 때만 요청을 받는다
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-http://localhost:8090}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      HOME: /tmp
    volumes:
      - ./projects:/app/projects
      - ${HOST_STATE_DIR:-./.state}:${STATE_DIR:-/app/.state}
      - ${HOST_BUILD_DIR:-./.build}:${BUILD_DIR:-/app/.build}
      - ./web/studio:/app/web/studio:ro
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8090}:8090"
    depends_on:
      data-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/studio/api/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  data-db:
  superset-db:
