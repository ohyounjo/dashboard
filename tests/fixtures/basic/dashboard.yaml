app:
  title: 테스트
  as_of: "2026-01-15"

datasets:
  things:
    sql: |
      SELECT t.*, o.label AS owner_label FROM raw.things t LEFT JOIN raw.owners o ON o.id = t.owner_id
    metrics:
      total_score: "SUM(score)"
  owners: { table: owners }

dashboards:
  main:
    title: 메인
    charts:
      - { key: c_total, title: 합계, viz: big_number_total, dataset: things, metric: total_score }
      - { key: c_line, title: 추이, viz: line, dataset: things, x: begins, time_grain: P1W, metrics: [{ sql: "COUNT(*)", label: n }] }
      - { key: c_table, title: 표, viz: table, dataset: things, columns: [id, phase, owner_label], order_by: [[begins, desc]], row_limit: 5 }
      - { key: c_raw, title: 원본, viz_type: word_cloud, dataset: owners, params: { series: label } }
    layout:
      - [c_total, { chart: c_line, width: 8 }]
      - [c_table, c_raw]
    filters:
      - { key: f_phase, label: 단계, type: select, dataset: things, column: phase }

tabs:
  - key: main
    label: 메인
    icon: grid
    sections: [{ type: superset, dashboard: main }]
  - key: board
    label: 보드
    icon: calendar
    sections:
      - type: gantt
        dataset: things
        fields: { label: id, start: begins, end: ends, progress: score }
        statuses: { a: { label: 에이, tone: good } }
      - type: kanban
        dataset: things
        group_by: phase
        columns: [{ value: a, label: A }, { value: b, label: B, icon: "✅" }]
        card: { title: id, chips: [owner_label] }
        filter: { column: owner_label, label: 담당 }
